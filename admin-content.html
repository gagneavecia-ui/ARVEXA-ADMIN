<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080909">
  <title>Cours et chapitres | ARVEXA Admin</title>
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#080909;--surface:#121614;--line:rgba(232,194,86,.13);--gold:#e0b84a;--green:#2d9b6b;--red:#d56655;--text:#f7f3e9;--muted:#91968e}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% -10%,#203d2c 0,transparent 35%),var(--bg);color:var(--text);font:14px/1.5 Inter,Arial,sans-serif}.side{width:250px;position:fixed;inset:0 auto 0 0;padding:24px 16px;background:#090b0a;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{font:700 22px "Playfair Display",serif;color:var(--text);text-decoration:none;padding:0 10px 24px;border-bottom:1px solid var(--line)}.brand span{color:var(--gold);font-style:italic}.nav{display:grid;gap:6px;padding-top:22px}.nav a{color:var(--muted);text-decoration:none;padding:12px 14px;border-radius:12px;display:flex;gap:12px;align-items:center}.nav a:hover,.nav a.active{color:var(--text);background:rgba(224,184,74,.1)}.nav i{width:18px;text-align:center}.foot{margin-top:auto;color:var(--muted);font-size:11px;padding:14px 10px;border-top:1px solid var(--line)}main{margin-left:250px;padding:28px clamp(14px,4vw,52px) 45px;max-width:1600px}header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:24px}h1{font:700 clamp(24px,3vw,34px) "Playfair Display",serif;margin:0}h1 span{color:var(--gold)}header p{color:var(--muted);margin:5px 0}.top{display:flex;align-items:center;gap:8px}.btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px;text-decoration:none}.mobile{display:none}.grid{display:grid;grid-template-columns:minmax(260px,.8fr) minmax(0,1.4fr);gap:18px}.panel{background:rgba(18,22,20,.94);border:1px solid var(--line);border-radius:18px;padding:20px}.panel h2{font-size:16px;margin:0 0 14px}.form{display:grid;gap:11px}.form label{font-size:11px;color:var(--muted)}.form input,.form select,.form textarea{width:100%;padding:11px 12px;border-radius:10px;background:#0e1210;border:1px solid var(--line);color:var(--text);outline:none;font:inherit}.form textarea{min-height:130px;resize:vertical}.primary{background:linear-gradient(135deg,#d5a928,#8e6812);border:0;color:#17130a;font-weight:700;padding:12px;border-radius:10px}.filters{display:flex;gap:9px;margin-bottom:15px}.filters input,.filters select{padding:10px;background:#0e1210;border:1px solid var(--line);color:var(--text);border-radius:10px}.filters input{flex:1}.list{display:grid;gap:9px}.item{border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h3{font-size:13px;margin:0 0 3px}.item p{font-size:11px;color:var(--muted);margin:0}.item-actions{display:flex;gap:5px}.mini{padding:7px 9px;border-radius:8px;background:transparent;color:var(--text);border:1px solid var(--line);font-size:11px}.danger{color:#f08e7e}.empty{text-align:center;color:var(--muted);padding:28px}.toast{position:fixed;right:18px;bottom:18px;background:#202821;border:1px solid var(--line);border-radius:12px;padding:13px 16px;opacity:0;transition:.2s}.toast.show{opacity:1}@media(max-width:800px){.side{left:-270px;width:270px;z-index:4}.side.open{left:0}main{margin:0;padding:16px 12px 32px}header{align-items:center}header p{font-size:11px}.mobile{display:inline-block}.grid{grid-template-columns:1fr}.panel{padding:14px}.top .btn span{display:none}.filters{flex-wrap:wrap}.filters input,.filters select{min-width:0;flex:1}}
  </style>
</head>
<body>
  <aside class="side" id="side"><a class="brand" href="index.html">ARVEX<span>A</span> <small>Admin</small></a><nav class="nav"><a href="index.html"><i class="fas fa-chart-pie"></i> Vue financière</a><a href="admin-users.html"><i class="fas fa-users"></i> Utilisateurs</a><a class="active" href="admin-content.html"><i class="fas fa-book-open"></i> Cours et chapitres</a></nav><div class="foot">gagneavecia@gmail.com<br>Console sécurisée</div></aside>
  <main><header><div><div class="top"><button class="btn mobile" id="menu" aria-label="Ouvrir le menu"><i class="fas fa-bars"></i></button><h1>Contenu et <span>chapitres</span></h1></div><p>Ajouter, modifier et publier les cours disponibles aux élèves.</p></div><div class="top"><a class="btn" href="index.html"><i class="fas fa-arrow-left"></i> <span>Finances</span></a></div></header><div class="grid"><section class="panel"><h2><i class="fas fa-plus-circle"></i> Ajouter un chapitre</h2><form class="form" id="form"><div><label for="title">Titre du chapitre</label><input id="title" required placeholder="Ex. Fonctions affines"></div><div><label for="subject">Matière</label><input id="subject" required placeholder="Ex. Mathématiques"></div><div><label for="level">Niveau</label><select id="level"><option>Seconde</option><option>Première</option><option>Terminale</option><option>Collège</option></select></div><div><label for="description">Description</label><textarea id="description" placeholder="Objectifs et contenu du chapitre"></textarea></div><div><label for="url">Lien du contenu (facultatif)</label><input id="url" type="url" placeholder="https://..."></div><button class="primary"><i class="fas fa-cloud-arrow-up"></i> Publier le chapitre</button></form></section><section class="panel"><h2><i class="fas fa-layer-group"></i> Chapitres publiés</h2><div class="filters"><input id="search" type="search" placeholder="Rechercher"><select id="filter"><option value="all">Toutes les matières</option></select></div><div class="list" id="list"></div><div class="empty" id="empty">Chargement du contenu...</div></section></div></main><div class="toast" id="toast"></div>
  <script type="module">
    import{initializeApp}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";import{getFirestore,collection,getDocs,addDoc,deleteDoc,doc,serverTimestamp,query,orderBy,limit}from"https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";
    const config={apiKey:"AIzaSyDHscOXw3rLuhV6z1Cny-bdYCumqpnG7QE",authDomain:"arvexa-fbf10.firebaseapp.com",projectId:"arvexa-fbf10",storageBucket:"arvexa-fbf10.firebasestorage.app",messagingSenderId:"920108330053",appId:"1:920108330053:web:f532d71cbc2c824bc7472c"},ADMIN="gagneavecia@gmail.com",app=initializeApp(config),auth=getAuth(app),db=getFirestore(app);let chapters=[];
    const $=id=>document.getElementById(id),safe=v=>String(v||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));function toast(m){$("toast").textContent=m;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),3000)}
    async function load(){const snap=await getDocs(query(collection(db,"chapters"),orderBy("createdAt","desc"),limit(300)));chapters=snap.docs.map(d=>({id:d.id,...d.data()}));const subjects=[...new Set(chapters.map(c=>c.subject).filter(Boolean))];$("filter").innerHTML='<option value="all">Toutes les matières</option>'+subjects.map(s=>`<option>${safe(s)}</option>`).join("");render()}
    function render(){const q=$("search").value.toLowerCase(),f=$("filter").value;const rows=chapters.filter(c=>(f==="all"||c.subject===f)&&(!q||[c.title,c.subject,c.description].some(v=>String(v||"").toLowerCase().includes(q))));$("list").innerHTML=rows.map(c=>`<article class="item"><div><h3>${safe(c.title)}</h3><p>${safe(c.subject)} · ${safe(c.level)} ${c.published===false?"· Brouillon":"· Publié"}</p><p>${safe(c.description)}</p></div><div class="item-actions"><button class="mini danger" data-delete="${c.id}"><i class="fas fa-trash"></i></button></div></article>`).join("");$("empty").style.display=rows.length?"none":"block"}
    $("form").addEventListener("submit",async e=>{e.preventDefault();const data={title:$("title").value.trim(),subject:$("subject").value.trim(),level:$("level").value,description:$("description").value.trim(),url:$("url").value.trim(),published:true,createdBy:ADMIN,createdAt:serverTimestamp()};if(!data.title||!data.subject)return;try{await addDoc(collection(db,"chapters"),data);e.target.reset();toast("Chapitre publié.");load()}catch(error){console.error(error);toast("Publication impossible.")}});$("list").addEventListener("click",async e=>{const b=e.target.closest("[data-delete]");if(b&&confirm("Supprimer ce chapitre ?")){await deleteDoc(doc(db,"chapters",b.dataset.delete));toast("Chapitre supprimé.");load()}});$("search").addEventListener("input",render);$("filter").addEventListener("change",render);$("menu").addEventListener("click",()=>$("side").classList.toggle("open"));onAuthStateChanged(auth,u=>{if(!u||u.email.toLowerCase()!==ADMIN)location.href="login.html";else load()});
  </script>
</body>
</html>
